[workspace]
members = ["crates/*", "tests/e2e"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.47", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hkdf = "0.12.4"
hmac = "0.12.1"
http = "1.5.0"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
postcard = { version = "1.1.3", features = ["alloc"] }
proptest = "1.7.0"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.9.2"
rcgen = "0.14.9"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = "0.23.31"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
socket2 = { version = "0.6.1", features = ["all"] }
sysinfo = "0.37.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-rustls = "0.26.2"
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.1"
