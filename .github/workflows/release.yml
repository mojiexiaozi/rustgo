name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Match tag to Cargo version
        run: python scripts/release.py verify-version --tag "${{ github.ref_name }}" --manifest Cargo.toml

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win-x86
            build_command: cargo build --locked --release --target x86_64-pc-windows-msvc -p rustgoc -p rustgos
            exe_suffix: .exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86
            build_command: cargo build --locked --release --target x86_64-unknown-linux-gnu -p rustgoc -p rustgos
            exe_suffix: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            build_command: cross build --locked --release --target aarch64-unknown-linux-gnu -p rustgoc -p rustgos
            exe_suffix: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Install cross
        if: matrix.platform == 'linux-arm64'
        run: cargo install cross --version 0.2.5 --locked
      - name: Build release binaries
        run: ${{ matrix.build_command }}
      - name: Package rustgoc
        run: >-
          python scripts/release.py package
          --tag "${{ github.ref_name }}"
          --platform "${{ matrix.platform }}"
          --binary rustgoc
          --executable "target/${{ matrix.target }}/release/rustgoc${{ matrix.exe_suffix }}"
          --output-dir release-input
      - name: Package rustgos
        run: >-
          python scripts/release.py package
          --tag "${{ github.ref_name }}"
          --platform "${{ matrix.platform }}"
          --binary rustgos
          --executable "target/${{ matrix.target }}/release/rustgos${{ matrix.exe_suffix }}"
          --output-dir release-input
      - name: Upload platform archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-input/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download all platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-input
          merge-multiple: true
      - name: Validate complete release
        run: |
          python scripts/release.py finalize --tag "${{ github.ref_name }}" --input-dir release-input --output-dir release-out
          test "$(find release-out -maxdepth 1 -type f | wc -l)" -eq 7
      - name: Create, audit, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-out/* --verify-tag --generate-notes --title "Rustgo ${{ github.ref_name }}" --draft
          mkdir release-audit
          gh release download "${{ github.ref_name }}" --dir release-audit
          test "$(find release-audit -maxdepth 1 -type f | wc -l)" -eq 7
          (cd release-audit && sha256sum --check SHA256SUMS)
          gh release edit "${{ github.ref_name }}" --draft=false
