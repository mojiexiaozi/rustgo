name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Cache Cargo data and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rustgo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rustgo-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Linux pidfd supervisor integration
        run: |
          python3 scripts/pidfd_supervisor.py preflight
          python3 scripts/pidfd_supervisor_test.py --integration
      - name: Bash cleanup self-test
        run: |
          bash -n scripts/e2e.sh
          bash scripts/e2e.sh --self-test
      - run: cargo test --workspace
      - name: Release E2E
        run: bash scripts/e2e.sh
      - name: Complex NAT namespace gate
        run: |
          sudo env "PATH=$PATH" bash tests/netns/run.sh all
          sudo env "PATH=$PATH" bash tests/netns/run.sh all
          sudo bash tests/netns/assert_cleanup.sh

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Cache Cargo data and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rustgo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rustgo-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Release E2E
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/e2e.ps1

  fuzz:
    name: Frame decoder fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Cache Cargo data and fuzz build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fuzz/target
          key: rustgo-fuzz-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rustgo-fuzz-${{ runner.os }}-
      - run: cargo +nightly fuzz run frame_decode -- -max_total_time=60
