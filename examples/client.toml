[client]
name = "home-pc"
server_addr = "tunnel.example.com:7443"
server_name = "tunnel.example.com"
certificate_authority_file = "${RUSTGO_CERTIFICATE_AUTHORITY_FILE}"
private_key_file = "${RUSTGO_DEVICE_PRIVATE_KEY_FILE}"
heartbeat_interval_secs = 20

[p2p]
enabled = true
prefer_direct = true
direct_timeout_secs = 8
reconnect_timeout_secs = 3
allow_relay_fallback = true
udp_port_range = "7400-7499"
tcp_port_range = "7400-7499"
# Optional; both addresses are required when NAT observation is enabled.
# observation_primary_addr = "tunnel.example.com:7443"
# observation_alternate_addr = "tunnel.example.com:7444"

[[tunnels]]
name = "ssh"
protocol = "tcp"
local_addr = "127.0.0.1:22"
remote_port = 2222

[[tunnels]]
name = "game"
protocol = "udp"
local_addr = "127.0.0.1:27015"
remote_port = 27015

[[exports]]
name = "ssh"
protocol = "tcp"
local_addr = "127.0.0.1:22"
allowed_peers = ["laptop"]
# Omit allowed_peers, or set it to [], only when every authenticated client
# should be authorized; rustgoc emits P2P_EXPORT_ALLOW_ALL in that case.

[[forwards]]
name = "office-ssh"
peer = "office-pc"
export = "ssh"
listen_addr = "127.0.0.1:2222"

# Optional V0.3 host telemetry. Disabled by default. Telemetry is authenticated
# and sent only when the server negotiates V0.3 protocol support.
# [telemetry]
# enabled = true
# # Collect host metrics every 5-300 seconds.
# sample_interval_secs = 10
# # Send aggregated reports every 10-600 seconds (must be >= sample_interval).
# report_interval_secs = 30
