[server]
bind_addr = "0.0.0.0:7443"
# Optional P2P NAT observation service. Configure both fields together.
p2p_observation_bind = "0.0.0.0:7443"
p2p_observation_alternate_bind = "0.0.0.0:7444"
# Required for UDP tunnels when bind_addr uses 0.0.0.0 or ::. Set this to a
# specific address assigned to the server interface that receives public UDP.
udp_bind_ip = "${RUSTGO_SERVER_UDP_BIND_IP}"
certificate_file = "${RUSTGO_SERVER_CERTIFICATE_FILE}"
private_key_file = "${RUSTGO_SERVER_PRIVATE_KEY_FILE}"
heartbeat_timeout_secs = 60

[limits]
max_clients = 128
max_tunnels_per_client = 64
max_tcp_connections_per_tunnel = 256
max_udp_sessions_per_tunnel = 1024
max_udp_payload_bytes = 65507

[[clients]]
name = "home-pc"
public_key = "${RUSTGO_DEVICE_PUBLIC_KEY}"
enabled = true
# Add one entry per peer. Client names and device public keys must both be unique.

# Optional V0.3 Web dashboard. Disabled by default. Never bind to a public address.
# [web]
# enabled = true
# bind = "127.0.0.1:7450"
# admin_username = "admin"
# # CRITICAL: Replace with a strong password (16+ characters). Protect server.toml
# # file permissions: readable only by the rustgos service account.
# admin_password = "CHANGE_ME_STRONG_PASSWORD_HERE"
# # Set to true when accessing through HTTPS reverse proxy (Caddy, Nginx).
# # May be false only for direct loopback HTTP access.
# cookie_secure = true
# # Required when cookie_secure=true. Must match the browser's HTTPS origin.
# external_origin = "https://tunnel.example.com"
# # Retain aggregated metrics for 1-30 days.
# history_days = 7
# database_path = "./rustgo-metrics.db"
# # SQLite cap in MiB (main + WAL + SHM together). Range: 16-4096.
# database_max_mib = 256
